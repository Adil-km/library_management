<div>
	{% set book_title = frappe.db.get_value('Book', doc.book, 'title') %}
	{% set book_author_id = frappe.db.get_value('Book', doc.book, 'author') %}
	{% set book_author = frappe.db.get_value('Author', book_author_id, 'author_name') %}
	<a href="/{{ doc.route |e }}">{{book_title}} | {{book_author}}</a>
</div>
